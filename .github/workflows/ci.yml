name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 배포 릴리스 게이트(deploy/deploy.sh)와 같은 검증 명령을 쓴다.
      # 순서도 동일: 타입 → 단위/계약 → 빌드
      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
