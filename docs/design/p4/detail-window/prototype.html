<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0f3">
  <title>v2 도판 상세 창 시안</title>
  <style>
    :root {
      --bg: #eef0f3;
      --ink: #15171c;
      --muted: #676c76;
      --line: #d9dce2;
      --black: #16181d;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --focus: #2f6fdb;
      --blue: #477fc4;
      --blue-dark: #21599b;
      --orange: #d97706;
      --orange-soft: #fff2dd;
      --green: #5ca06d;
      --green-soft: #e9f4eb;
      --yellow: #e7c950;
      --pink: #d779a7;
      --teal: #44a99b;
      --purple: #8171bd;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-body: "Noto Sans KR", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      --font-display: "Do Hyeon", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
      font-synthesis: none;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    body { min-height: 100vh; overflow: hidden; background: var(--bg); font-size: 14px; line-height: 1.45; }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button { border: 0; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .prototype-shell { min-height: 100vh; padding: 24px; background: var(--bg); }
    .demo-bar { max-width: 1440px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .demo-kicker { color: var(--muted); font: 11px/1.1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
    .demo-title { margin: 4px 0 0; font: 28px/1 var(--font-display); }
    .ghost-board { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; opacity: .72; }
    .ghost-card { min-height: 220px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: #f7f8fa; }
    .ghost-card:nth-child(2) { background: #f5f1df; }
    .ghost-card:nth-child(3) { background: #e6f0e8; }
    .ghost-card:nth-child(4) { background: #ece7f4; }
    .ghost-card h2 { margin: 0 0 12px; font-size: 14px; }
    .ghost-map { height: 120px; border-radius: 10px; background: repeating-linear-gradient(45deg, #dfe2e7 0 2px, transparent 2px 14px), #f9fafb; }
    .ghost-line { width: 70%; height: 8px; margin-top: 16px; border-radius: 999px; background: #d5d8de; }
    .scrim { position: fixed; z-index: 5; inset: 0; background: rgba(20, 24, 32, .45); }
    .scrim.is-hidden { display: none; }

    .detail-modal { position: fixed; z-index: 10; inset: 5vh 5vw; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,.72); border-radius: 18px; background: var(--surface); box-shadow: 0 24px 70px rgba(20,24,32,.24); }
    .detail-modal.is-closed { display: none; }
    .modal-header { flex: 0 0 66px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px 12px 22px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
    .modal-title { display: flex; min-width: 0; align-items: baseline; gap: 12px; }
    .modal-code { flex: 0 0 auto; color: var(--muted); font: 14px/1 var(--font-display); letter-spacing: .04em; }
    .modal-title h1 { min-width: 0; margin: 0; font: 23px/1.1 var(--font-display); white-space: nowrap; }
    .modal-address { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .modal-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
    .state-control { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .state-control select { min-height: 38px; max-width: 174px; padding: 6px 28px 6px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); }
    .sample-badge { padding: 7px 10px; border-radius: 999px; color: #5b4a15; background: #fff4cf; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .icon-btn { display: inline-grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); transition: background .18s ease, border-color .18s ease, transform .18s ease; }
    .icon-btn:hover { border-color: var(--ink); background: #f2f3f5; }
    .icon-btn:active { transform: scale(.97); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

    .modal-body { display: grid; min-height: 0; flex: 1 1 auto; grid-template-columns: minmax(0, 1.45fr) minmax(390px, .8fr); gap: 16px; padding: 16px; background: #f2f4f6; }
    .map-panel, .detail-pane { min-width: 0; min-height: 0; }
    .map-panel { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
    .map-wrap { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; background: #f7f8f8; }
    .map-wrap svg { display: block; width: 100%; height: 100%; }
    .map-toolbar { position: absolute; z-index: 2; top: 14px; right: 14px; display: grid; gap: 8px; }
    .map-toolbar .icon-btn { width: 42px; height: 42px; box-shadow: 0 4px 14px rgba(20,24,32,.08); }
    .map-toolbar .icon-btn svg { width: 20px; height: 20px; }
    .map-legend { position: absolute; z-index: 2; right: 14px; bottom: 14px; left: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px; padding: 9px 12px; border: 1px solid rgba(217,220,226,.92); border-radius: 9px; background: rgba(255,255,255,.93); box-shadow: 0 4px 14px rgba(20,24,32,.06); }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; color: #414650; font-size: 11px; white-space: nowrap; }
    .legend-mark { width: 10px; height: 10px; border: 1px solid rgba(21,23,28,.2); border-radius: 3px; }
    .legend-mark.line { width: 17px; height: 3px; border: 0; border-radius: 999px; }
    .map-hint { position: absolute; z-index: 2; top: 14px; left: 14px; max-width: 250px; padding: 7px 10px; border-radius: 8px; color: #4d535e; background: rgba(255,255,255,.9); font-size: 11px; }
    .map-feature { cursor: pointer; outline: none; }
    .map-feature:focus-visible { filter: drop-shadow(0 0 0.8px var(--focus)) drop-shadow(0 0 2px var(--focus)); }
    .feature-building { fill: var(--yellow); fill-opacity: .88; stroke: #fff; stroke-width: 1.4; }
    .feature-building.education { fill: var(--green); }
    .feature-building.commerce { fill: #ee9c64; }
    .feature-building.selected { stroke: var(--ink); stroke-width: 3.6; fill-opacity: 1; }
    .feature-zone { fill: var(--yellow); fill-opacity: .56; stroke: #fff; stroke-width: 2; }
    .feature-zone.green { fill: #a9d49c; }
    .feature-zone.pink { fill: #e99abb; }
    .feature-zone.selected { stroke: var(--ink); stroke-width: 5; fill-opacity: .78; }
    .feature-parcel { fill: #dba995; fill-opacity: .33; stroke: #fff; stroke-width: 1.2; }
    .feature-parcel.selected { stroke: var(--ink); stroke-width: 4; fill-opacity: .62; }
    .route-line { fill: none; stroke: var(--orange); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
    .route-line-under { fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .point-marker { fill: var(--orange); stroke: #fff; stroke-width: 3; }
    .site-marker { fill: var(--black); stroke: #fff; stroke-width: 3; }
    .heat-ring { fill: none; stroke: #477fc4; stroke-opacity: .35; stroke-width: 2; }
    .wind-sector { fill: #b2ab9a; stroke: #fff; stroke-width: 2; fill-opacity: .95; }

    .detail-pane { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .selection-card, .table-card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: 0 3px 12px rgba(20,24,32,.04); }
    .selection-card { flex: 0 0 auto; max-height: 49%; overflow: auto; padding: 16px; }
    .selection-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card-kicker { color: var(--muted); font-size: 12px; font-weight: 700; }
    .selection-card h2 { margin: 3px 0 0; font: 25px/1.15 var(--font-display); letter-spacing: -.01em; }
    .selection-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .text-btn { min-height: 38px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; color: #343841; background: var(--surface); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .text-btn:hover { border-color: var(--ink); background: #f5f6f8; }
    .metric-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; margin-top: 4px; }
    .field { min-width: 0; display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eef0f3; }
    .field dt { color: var(--muted); font-size: 12px; }
    .field dd { min-width: 0; margin: 0; overflow-wrap: anywhere; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chip { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 8px; border-radius: 999px; color: #5b4a15; background: #f8e9a1; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .chip.blue { color: #173f70; background: #dbeafa; }
    .chip.green { color: #245a30; background: #dceedd; }
    .chip.orange { color: #7a4200; background: #ffe4ba; }
    .missing-note { display: flex; gap: 8px; margin-top: 12px; padding: 9px 10px; border-radius: 9px; color: #754611; background: #fff7e7; font-size: 12px; }
    .missing-note svg { flex: 0 0 18px; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .missing-note strong { color: #55320f; }
    .source-line { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .composition { margin-top: 12px; }
    .composition-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .composition-bar { display: flex; height: 12px; overflow: hidden; border-radius: 999px; background: #edf0f2; }
    .composition-bar span { min-width: 2px; }
    .composition-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 12px; margin-top: 8px; }
    .composition-legend span { display: flex; align-items: center; gap: 5px; color: #4d535e; font-size: 11px; }
    .composition-legend i { width: 8px; height: 8px; border-radius: 2px; }
    .control-block { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
    .control-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .segmented { display: flex; flex-wrap: wrap; gap: 6px; }
    .segmented button { min-height: 40px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: #4d535e; background: var(--surface); font-size: 12px; font-weight: 700; }
    .segmented button[aria-pressed="true"] { border-color: var(--black); color: #fff; background: var(--black); }

    .table-card { min-height: 0; display: flex; flex: 1 1 auto; flex-direction: column; overflow: hidden; }
    .table-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
    .table-count { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .table-actions { display: flex; min-width: 0; flex: 1 1 auto; justify-content: flex-end; gap: 6px; }
    .search-wrap { position: relative; min-width: 0; flex: 1 1 170px; max-width: 244px; }
    .search-wrap svg { position: absolute; top: 50%; left: 10px; width: 16px; height: 16px; transform: translateY(-50%); fill: none; stroke: var(--muted); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; pointer-events: none; }
    .search-input { width: 100%; min-height: 40px; padding: 7px 9px 7px 32px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); }
    .search-input::placeholder { color: #8a9099; }
    .csv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: #30343b; background: var(--surface); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .csv-btn:hover { border-color: var(--ink); background: #f5f6f8; }
    .csv-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .table-scroll { min-height: 0; flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; z-index: 1; top: 0; padding: 0; border-bottom: 1px solid var(--line); color: var(--muted); background: #fbfcfd; text-align: left; white-space: nowrap; }
    th.numeric, td.numeric { text-align: right; }
    .sort-button { display: flex; width: 100%; min-height: 38px; align-items: center; justify-content: flex-start; gap: 3px; padding: 7px 9px; border-radius: 0; color: inherit; background: transparent; font-size: 11px; font-weight: 700; text-align: left; }
    th.numeric .sort-button { justify-content: flex-end; }
    .sort-button:hover { background: #f0f2f5; color: var(--ink); }
    .sort-glyph { color: #9da3ad; font-size: 11px; }
    tr[data-row-id] { cursor: pointer; }
    td { padding: 9px; border-bottom: 1px solid #edf0f3; vertical-align: middle; }
    tbody tr:hover td, tbody tr:focus-visible td { background: #f4f7fb; }
    tbody tr.is-selected td { background: #edf4ff; }
    .cell-primary { display: block; color: var(--ink); font-weight: 700; }
    .cell-secondary { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .table-footer { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .table-message { display: grid; min-height: 170px; place-items: center; padding: 24px; color: var(--muted); text-align: center; }
    .empty-icon { display: grid; width: 42px; height: 42px; margin: 0 auto 10px; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); background: #f8f9fa; }
    .empty-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; }
    .message-title { color: var(--ink); font-weight: 700; }
    .message-body { margin: 5px 0 13px; }
    .skeleton { height: 11px; border-radius: 999px; background: linear-gradient(90deg, #eceff2 25%, #f7f8f9 50%, #eceff2 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    .skeleton.large { width: 52%; height: 26px; margin-top: 9px; }
    .skeleton.medium { width: 75%; margin-top: 11px; }
    .skeleton.short { width: 36%; margin-top: 9px; }
    .selection-card:has(.error-card) { border-color: #efc5bf; }
    .error-card { padding: 2px 0; }
    .error-title { display: flex; align-items: center; gap: 8px; color: var(--danger); font-weight: 800; }
    .error-title svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .error-body { margin: 8px 0 12px; color: #5a3430; }
    .error-action { min-height: 40px; padding: 7px 12px; border-radius: 8px; color: #fff; background: var(--danger); font-size: 12px; font-weight: 700; }
    .status-live { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .reopen-btn { position: fixed; z-index: 4; right: 24px; bottom: 24px; display: none; min-height: 44px; padding: 8px 14px; border-radius: 999px; color: #fff; background: var(--black); font-weight: 700; }
    body.modal-closed .reopen-btn { display: block; }

    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    @media (max-width: 1020px) {
      .detail-modal { inset: 3vh 2vw; }
      .modal-body { grid-template-columns: minmax(0, 1.15fr) minmax(350px, .85fr); }
      .modal-address { max-width: 30vw; }
      .ghost-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      body { font-size: 14px; }
      .prototype-shell { padding: 12px; }
      .demo-bar { margin-bottom: 10px; }
      .demo-title { font-size: 23px; }
      .ghost-board { grid-template-columns: 1fr 1fr; gap: 8px; }
      .ghost-card { min-height: 160px; padding: 10px; }
      .detail-modal { inset: 0; border: 0; border-radius: 0; }
      .modal-header { flex-basis: 58px; padding: 8px 10px 8px 14px; gap: 8px; }
      .modal-title { gap: 7px; }
      .modal-code { font-size: 12px; }
      .modal-title h1 { font-size: 18px; }
      .modal-address { display: none; }
      .modal-actions { gap: 5px; }
      .state-control { font-size: 0; }
      .state-control select { width: 108px; min-height: 40px; padding-right: 4px; font-size: 12px; }
      .sample-badge { display: none; }
      .icon-btn { width: 40px; height: 40px; }
      .modal-body { display: flex; flex-direction: column; gap: 0; padding: 0; }
      .map-panel { flex: 0 0 43%; min-height: 240px; border: 0; border-radius: 0; }
      .map-toolbar { top: 10px; right: 10px; gap: 6px; }
      .map-toolbar .icon-btn { width: 42px; height: 42px; }
      .map-hint { top: 10px; left: 10px; max-width: 190px; font-size: 10px; }
      .map-legend { right: 10px; bottom: 10px; left: 10px; gap: 4px 10px; padding: 7px 9px; }
      .legend-item { font-size: 10px; }
      .detail-pane { flex: 1 1 57%; gap: 0; overflow: hidden; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; background: #f2f4f6; }
      .selection-card { max-height: 52%; margin: 8px 10px 8px; padding: 13px; border-radius: 14px; box-shadow: 0 2px 8px rgba(20,24,32,.04); }
      .selection-card h2 { font-size: 21px; }
      .selection-subtitle { font-size: 12px; }
      .field-grid { gap: 0 10px; }
      .field { padding: 5px 0; }
      .field dt, .field dd { font-size: 11px; }
      .metric-row { margin-top: 10px; padding: 8px 0; }
      .metric-value { font-size: 16px; }
      .composition-legend { gap: 4px 8px; }
      .source-line { margin-top: 8px; font-size: 10px; }
      .control-block { margin-top: 9px; padding-top: 9px; }
      .segmented { gap: 4px; }
      .segmented button { min-height: 38px; padding: 6px 8px; font-size: 11px; }
      .table-card { flex: 1 1 57%; margin: 0 10px 10px; border-radius: 14px; }
      .table-head { align-items: stretch; flex-direction: column; gap: 8px; padding: 10px; }
      .table-actions { justify-content: stretch; }
      .search-wrap { max-width: none; }
      .search-input, .csv-btn { min-height: 44px; }
      td { padding: 8px 7px; }
      .sort-button { min-height: 40px; padding: 7px; }
      .table-footer { padding: 7px 10px; }
    }
  </style>
</head>
<body>
  <div class="prototype-shell" aria-hidden="true">
    <div class="demo-bar">
      <div>
        <div class="demo-kicker">V2 DESIGN PROTOTYPE</div>
        <h1 class="demo-title">분석 보드</h1>
      </div>
      <div class="ghost-line" style="width:180px;margin:0"></div>
    </div>
    <div class="ghost-board">
      <article class="ghost-card"><h2>03 건축물 용도</h2><div class="ghost-map"></div><div class="ghost-line"></div></article>
      <article class="ghost-card"><h2>08 용도지역</h2><div class="ghost-map"></div><div class="ghost-line"></div></article>
      <article class="ghost-card"><h2>15 도보권</h2><div class="ghost-map"></div><div class="ghost-line"></div></article>
      <article class="ghost-card"><h2>23 개방감</h2><div class="ghost-map"></div><div class="ghost-line"></div></article>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <main class="detail-modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-header">
      <div class="modal-title">
        <span class="modal-code" id="modalCode">D03</span>
        <h1 id="modalTitle">건축물 용도</h1>
        <span class="modal-address">서울특별시 강동구 아리수로 250 · 반경 800 m</span>
      </div>
      <div class="modal-actions">
        <label class="state-control">시안 상태

    function rowsFor(kind) {

    function tableSpec(kind) {

        walk: { count: "29개", headers: [["name", "이름", ""], ["kind", "구분", ""], ["straight", "직선(m)", "numeric"], ["walk", "걸어서(분)", "numeric"]], sortKeys: { walk: "walk", straight: "straight", name: "name" } },

    function tableHeader(kind, spec) {

    function featureRect(item, index, selectedId) {
      const x = 145 + (index % 6) * 54 + Math.floor(index / 6) * 14;
      const y = 215 + Math.floor(index / 6) * 28 + (index % 2) * 5;
      const tone = item.tone === "education" ? "education" : item.tone === "commerce" ? "commerce" : "";
      return `<rect class="map-feature feature-building ${tone} ${item.id === selectedId ? "selected" : ""}" x="${x}" y="${y}" width="${26 + (index % 3) * 7}" height="${12 + (index % 2) * 6}" rx="2" tabindex="0" role="button" data-feature-kind="building" data-feature-id="${item.id}" aria-label="${escapeHtml(item.name)} ${number(item.area, 0)} 제곱미터"></rect>`;
    }
    function zoneFeatures() {
      const selectedId = selected.zone;
      return `<path class="map-feature feature-zone green ${selectedId === "z-001" ? "selected" : ""}" d="M75 60H340L360 154 286 218 164 208 75 246Z" tabindex="0" role="button" data-feature-kind="zone" data-feature-id="z-001" aria-label="자연녹지지역"></path><path class="map-feature feature-zone ${selectedId === "z-002" ? "selected" : ""}" d="M74 246 286 218 360 302 336 504 82 564Z" tabindex="0" role="button" data-feature-kind="zone" data-feature-id="z-002" aria-label="제2종일반주거지역"></path><path class="map-feature feature-zone ${selectedId === "z-003" ? "selected" : ""}" d="M286 218 360 154 530 114 584 260 450 314 360 302Z" tabindex="0" role="button" data-feature-kind="zone" data-feature-id="z-003" aria-label="준주거지역"></path><path class="map-feature feature-zone pink ${selectedId === "z-005" ? "selected" : ""}" d="M450 314 584 260 666 358 562 458 412 416Z" tabindex="0" role="button" data-feature-kind="zone" data-feature-id="z-005" aria-label="근린상업지역"></path><path class="map-feature feature-zone green" d="M530 114 650 74 666 358 584 260Z"></path>`;
    }
    function parcelFeatures() {
      return Array.from({ length: 26 }, (_, i) => { const x = 110 + (i % 7) * 78; const y = 86 + Math.floor(i / 7) * 88; const id = `p-${String((i % 10) + 1).padStart(3, "0")}`; return `<path class="map-feature feature-parcel ${selected.parcel === id ? "selected" : ""}" d="M${x} ${y}h${56 + (i % 3) * 9}v${52 + (i % 2) * 16}h-${42 + (i % 3) * 8}Z" tabindex="0" role="button" data-feature-kind="parcel" data-feature-id="${id}" aria-label="지번 ${id}"></path>`; }).join("");
    }
    function walkFeatures() {
      return `<path d="M104 218 C164 248 196 254 242 292 S316 340 360 300 S420 248 508 274 586 336 622 396" fill="none" stroke="#c9e5dc" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"></path><path d="M104 218 C164 248 196 254 242 292 S316 340 360 300 S420 248 508 274 586 336 622 396" fill="none" stroke="#63b49b" stroke-width="2"></path><path class="route-line-under" d="M360 300 C392 300 414 280 435 267 S479 260 505 274"></path><path class="route-line" d="M360 300 C392 300 414 280 435 267 S479 260 505 274"></path><circle class="point-marker" cx="505" cy="274" r="8" tabindex="0" role="button" data-feature-kind="walk" data-feature-id="w-009" aria-label="고덕역 걸어서 4분 298미터"></circle><text x="516" y="267" fill="#8b4b00" font-size="12" font-weight="700">고덕역 · 4분</text>`;
    }
    function densityFeatures() {
      const scale = density.radius === 57 ? .78 : density.radius === 160 ? 1.24 : 1;
      return `<circle cx="360" cy="300" r="${154 * scale}" fill="url(#densityHeat)"></circle><circle class="heat-ring" cx="360" cy="300" r="${80 * scale}"></circle><circle class="heat-ring" cx="360" cy="300" r="${120 * scale}"></circle><circle class="heat-ring" cx="360" cy="300" r="${160 * scale}"></circle><g fill="#477fc4" fill-opacity=".6">${Array.from({ length: 30 }, (_, i) => `<circle cx="${150 + (i * 47) % 400}" cy="${150 + (i * 83) % 300}" r="${2 + (i % 4)}"></circle>`).join("")}</g>`;
    }
    function svfFeatures() {
      return `<rect x="84" y="24" width="552" height="552" fill="url(#svfHeat)" opacity=".68"></rect><g fill="#f2eee5" fill-opacity=".8" stroke="#42648c" stroke-opacity=".7" stroke-width="2"><rect x="146" y="360" width="54" height="25" rx="3"></rect><rect x="216" y="330" width="42" height="30" rx="3"></rect><rect x="278" y="382" width="65" height="22" rx="3"></rect><rect x="420" y="174" width="72" height="42" rx="3"></rect><rect x="502" y="208" width="52" height="32" rx="3"></rect><rect x="468" y="420" width="60" height="28" rx="3"></rect></g><circle class="point-marker" cx="360" cy="300" r="8" tabindex="0" role="button" data-feature-kind="svf" data-feature-id="s-004" aria-label="개방감 100퍼센트"></circle>`;
    }
    function windFeatures() {
      const center = [360, 300]; const sectors = DATA.wind.map((item, i) => { const theta = (i / 16) * Math.PI * 2 - Math.PI / 2; const next = theta + Math.PI / 8; const length = 70 + item[1] * 7; const x1 = center[0] + Math.cos(theta - .08) * length; const y1 = center[1] + Math.sin(theta - .08) * length; const x2 = center[0] + Math.cos(next + .08) * length; const y2 = center[1] + Math.sin(next + .08) * length; return `<path class="wind-sector" d="M${center[0]} ${center[1]}L${x1.toFixed(1)} ${y1.toFixed(1)}A${length} ${length} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z"></path>`; }).join(""); return `<circle cx="360" cy="300" r="180" fill="#f3f4f3"></circle><circle cx="360" cy="300" r="130" fill="none" stroke="#d9d5cc" stroke-dasharray="2 4"></circle><circle cx="360" cy="300" r="75" fill="none" stroke="#d9d5cc" stroke-dasharray="2 4"></circle>${sectors}<circle cx="360" cy="300" r="33" fill="#f8f7f2" stroke="#d9d5cc"></circle>`; }
    function renderMap() {
      let svg = baseMap();
      if (state === "d03-summary" || state === "d03-building" || state === "loading" || state === "error" || state === "empty") svg += DATA.buildings.map((item, i) => featureRect(item, i, state === "d03-building" ? selected.building : null)).join("");
      if (state === "d08-zone") svg += zoneFeatures();
      if (state === "d28-walk") svg += walkFeatures();
      if (state === "d16-density") svg += densityFeatures();
      if (state === "d29-point") svg += svfFeatures();
      if (state === "d20-parcel") svg += parcelFeatures();
      if (state === "d24-wind") svg += windFeatures();
      svg += finishMap();
      document.getElementById("mapWrap").innerHTML = svg;
      document.querySelectorAll("[data-feature-kind]").forEach((node) => {
        node.addEventListener("click", () => selectFeature(node.dataset.featureKind, node.dataset.featureId));
        node.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectFeature(node.dataset.featureKind, node.dataset.featureId); } });
      });
    }
    function selectFeature(kind, id) {
      if (kind === "svf") selected.svf = id;
      else selected[kind] = id;
      if (kind === "building" && state === "d03-summary") state = "d03-building";
      render();
      liveRegion.textContent = `${kind === "building" ? "건물" : kind === "zone" ? "구역" : kind === "walk" ? "도보권 지점" : "지점"}을 선택했습니다.`;
    }
    function renderLegend() {
      const legend = document.getElementById("mapLegend");
      const items = {
        "d03-summary": [["var(--yellow)", "주거"], ["var(--green)", "교육복지"], ["#ee9c64", "근린생활"], ["#d8dadd", "미상"]],
        "d03-building": [["var(--yellow)", "주거"], ["var(--green)", "교육복지"], ["#ee9c64", "근린생활"], ["#16181d", "선택 건물"]],
        "d08-zone": [["#a9d49c", "녹지지역"], ["var(--yellow)", "주거지역"], ["var(--pink)", "상업지역"], ["#16181d", "선택 외곽선"]],
        "d28-walk": [["#63b49b", "5분 안"], ["#c9e5dc", "10분 안"], ["var(--orange)", "선택 경로"]],
        "d16-density": [["#d779a7", "높은 밀도"], ["#e8c951", "주변 밀도"], ["#477fc4", "건물 중심"]],
        "d29-point": [["#263653", "0%"], ["#7ca4cb", "50%"], ["#dbeaf2", "100%"], ["#16181d", "선택 지점"]],
        "d20-parcel": [["#dba995", "필지"], ["#16181d", "선택 필지"]],
        "d24-wind": [["#b2ab9a", "방위별 빈도"], ["#d9d5cc", "등치선"]],
        empty: [["#d8dadd", "데이터 없음"]], loading: [["#d8dadd", "불러오는 중"]], error: [["#b42318", "오류"]]
      }[state];
      legend.innerHTML = items.map(([color, label]) => `<span class="legend-item"><i class="legend-mark ${label === "선택 경로" ? "line" : ""}" style="background:${color}"></i>${escapeHtml(label)}</span>`).join("");
    }

    function render() {
      const meta = currentMeta();
      document.body.dataset.state = state;
      document.getElementById("modalCode").textContent = meta.code;
      document.getElementById("modalTitle").textContent = meta.title;
      document.getElementById("mapHint").textContent = meta.hint;
      statePicker.value = state;
      renderMap();
      renderLegend();
      renderSelection();
      renderTable();
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button, [data-row-id]");
      if (!target) return;
      if (target.matches("[data-density-key]")) { density[target.dataset.densityKey] = target.dataset.densityKey === "radius" ? Number(target.dataset.densityValue) : target.dataset.densityValue; render(); return; }
      if (target.matches("[data-clear]")) { closeSelection(target.dataset.clear); return; }
      if (target.matches("[data-empty-action]")) { searchTerm = ""; state = "d03-summary"; render(); return; }
      if (target.matches("[data-retry]")) { state = "d03-summary"; render(); liveRegion.textContent = "다시 시도했습니다. 요약 목록을 표시합니다."; return; }
      if (target.matches("[data-sort]")) {
        const kind = currentMeta().table; const key = target.dataset.sort; const order = sortState[kind] || { key, dir: "asc" }; sortState[kind] = { key, dir: order.key === key && order.dir === "asc" ? "desc" : "asc" }; renderTable(); return;
      }
      if (target.matches("[data-row-id]")) {
        const kind = currentMeta().table; const id = target.dataset.rowId;
        if (kind === "building") { selected.building = id; state = "d03-building"; }
        if (kind === "zone") selected.zone = id;
        if (kind === "walk") selected.walk = id;
        if (kind === "parcel") selected.parcel = id;
        if (kind === "svf") selected.svf = id;
        render();
        liveRegion.textContent = "행을 선택했습니다. 지도의 강조 표시가 갱신되었습니다.";
      }
      if (target.dataset.mapAction) liveRegion.textContent = target.dataset.mapAction === "fit" ? "지도 전체 범위로 돌아왔습니다." : `지도를 ${target.dataset.mapAction === "zoom-in" ? "확대" : "축소"}했습니다.`;
      if (target.matches("[data-csv]")) {
        const kind = target.dataset.csv; const spec = tableSpec(kind); const rows = rowsFor(kind); const csv = "\uFEFF" + [spec.headers.map((x) => x[1]).join(","), ...rows.map((row) => [row.primary, row.secondary, ...row.cells.map((cell) => String(cell).replace(/<[^>]+>/g, ""))].map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(","))].join("\n"); const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); const link = document.createElement("a"); link.href = url; link.download = `서울_강동구_아리수로250_${currentMeta().title}_800m.csv`; link.click(); URL.revokeObjectURL(url); liveRegion.textContent = "UTF-8 BOM CSV를 준비했습니다.";
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.target.matches("[data-row-id]") && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); event.target.click(); }
      if (event.key !== "Tab" || !isOpen) return;
      const focusable = [...modal.querySelectorAll("button:not([disabled]), input, select, [tabindex]:not([tabindex='-1'])")].filter((node) => node.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0]; const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    document.addEventListener("input", (event) => {
      if (!event.target.matches("#searchInput")) return;
      searchTerm = event.target.value;
      const value = searchTerm;
      renderTable();
      const input = document.getElementById("searchInput");
      if (input) { input.focus(); input.setSelectionRange(value.length, value.length); }
    });
    statePicker.addEventListener("change", (event) => setState(event.target.value));
    closeButton.addEventListener("click", () => { isOpen = false; modal.classList.add("is-closed"); scrim.classList.add("is-hidden"); document.body.classList.add("modal-closed"); reopenButton.focus(); });
    reopenButton.addEventListener("click", () => { isOpen = true; modal.classList.remove("is-closed"); scrim.classList.remove("is-hidden"); document.body.classList.remove("modal-closed"); closeButton.focus(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape" && isOpen) { event.preventDefault(); closeButton.click(); } });
    render();
  </script>
</body>
